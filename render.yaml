services:
  - type: web
    name: ai-pr-reviewer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY_PATH
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_API_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: OPENAI_API_KEY
        value: ""
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pr_reviewer
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: info
